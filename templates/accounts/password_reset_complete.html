{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Password changed" %} — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container auth-shell">
  <div class="auth-card text-center">
    <h1>{% trans "Password changed" %}</h1>
    <p class="muted">{% trans "Your password has been updated. You can now log in." %}</p>
    <a class="btn btn--primary" href="{% url 'accounts:login' %}">{% trans "Log in" %}</a>
  </div>
</div>
{% endblock %}
