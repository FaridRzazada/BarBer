{% autoescape off %}
<div style="font-family:Inter,Arial,sans-serif;max-width:520px;margin:0 auto;color:#201c18">
  <h2 style="color:#17130f">Reset your password</h2>
  <p>You (or someone else) requested a password reset for your Nearby account.</p>
  <p>
    <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}"
       style="display:inline-block;background:#23201d;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none">
      Choose a new password
    </a>
  </p>
  <p style="color:#6f665d;font-size:14px">If you didn't request this, you can safely ignore this email.</p>
  <p style="color:#6f665d;font-size:14px">— The Nearby team</p>
</div>
{% endautoescape %}
