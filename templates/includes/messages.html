{% if messages %}
<div class="alerts" role="region" aria-label="Notifications">
  {% for message in messages %}
    <div class="alert alert--{{ message.tags }}" role="status">
      <div>{{ message }}</div>
      <button class="alert__close" aria-label="Dismiss">&times;</button>
    </div>
  {% endfor %}
</div>
{% endif %}
